<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="translator p-4 p-md-5 ">
                    
                    <h2 class="text-center mb-4 fw-bold text-light bg-dark py-2 rounded border border-secondary">
                        Translator App
                    </h2>

                    <div class="row g-4 mb-4">
                        
                        <div class="col-md-6">
                            <textarea id="ُEnterText" class="form-control mb-3" placeholder="أدخل النص هنا..."></textarea>
                            <select id="EnterLang" class="form-select"></select>
                        </div>

                        <div class="col-md-6">
                            <textarea id="targetText" class="form-control mb-3" placeholder="الترجمة ستظهر هنا..." readonly></textarea>
                            <select id="targetLang" class="form-select"></select>
                        </div>
                    </div>

                    
                    <div class="d-grid col-md-4 mx-auto">
                        <button id="translateBtn" class="btn btn-primary py-2 fw-bold ">
                            Translate
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="App.js"></script>
</body>
</html>
